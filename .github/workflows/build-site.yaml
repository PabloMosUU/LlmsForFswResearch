name: Manual Site Build

on:
  workflow_dispatch:
    inputs:
      department:
        description: "Which department's tutorial to build?"
        required: true
        type: choice
        options:
          - cp
          - ccfs
          - iss
          - yf
          - deeds

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🔧 FIX: The "Unable to locate R" error happened because Quarto
      # found {r} code chunks but the runner had no R installed.
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: Rscript -e 'install.packages(c("knitr", "rmarkdown", "ggplot2", "dplyr", "tidyr", "readr", "purrr", "stringr"))'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-luatex \
            texlive-latex-extra \
            texlive-fonts-recommended \
            latexmk

      - name: Prepare & Render Site
        run: |
          # 1. Generate department-specific tutorial
          python scripts/build_tutorial.py --department ${{ github.event.inputs.department }} --render
          
          # 2. Render the slides to PDF
          make
          
          # 3. Render the index to HTML
          quarto render index.qmd --metadata department=${{ github.event.inputs.department }}

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          
