name: Update tutorial page

on:
  workflow_dispatch:
    inputs:
      department:
        description: "Which tutorial to publish"
        required: true
        type: choice
        options:
          - cp
          - ccfs
          - iss
          - yf
          - deeds

      source:
        description: "Where should the HTML come from?"
        required: true
        type: choice
        default: prerendered
        options:
          - prerendered
          - rebuild

permissions:
  contents: write

concurrency:
  group: publish-tutorial
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      DEPARTMENT: ${{ inputs.department }}
      SOURCE_MODE: ${{ inputs.source }}

    steps:
      # PAGEREPO
      - name: Check out page repository
        uses: actions/checkout@v6
        with:
          path: page

      # MAINREPO
      - name: Check out tutorial repository
        uses: actions/checkout@v6
        with:
          repository: PabloMosUU/LlmsForFswResearch
          ref: main
          path: source

      # Only needed when "rebuild" was selected
      - name: Set up Python
        if: inputs.source == 'rebuild'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: source/requirements.txt

      - name: Install Python dependencies
        if: inputs.source == 'rebuild'
        working-directory: source
        run: python -m pip install -r requirements.txt

      - name: Set up Quarto
        if: inputs.source == 'rebuild'
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Rebuild selected tutorial
        if: inputs.source == 'rebuild'
        working-directory: source
        run: python scripts/build_tutorial.py --department "$DEPARTMENT" --render

      # Both modes converge here.
      - name: Copy tutorial to page repository
        run: |
          SOURCE_FILE="source/tutorials/$DEPARTMENT/tutorial.html"
          TARGET_FILE="page/documents/tutorial.html"

          if [ ! -f "$SOURCE_FILE" ]; then
            echo "ERROR: Tutorial HTML does not exist:"
            echo "$SOURCE_FILE"
            exit 1
          fi

          mkdir -p "$(dirname "$TARGET_FILE")"
          cp "$SOURCE_FILE" "$TARGET_FILE"

          echo "Published $SOURCE_FILE -> $TARGET_FILE"

      - name: Commit and push
        working-directory: page
        run: |
          if git diff --quiet -- documents/tutorial.html; then
            echo "tutorial.html is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add documents/tutorial.html
          git commit -m "Update $DEPARTMENT tutorial ($SOURCE_MODE)"
          git push
